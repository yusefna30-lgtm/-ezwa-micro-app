<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عِزوة | EZWA - متجر القهوة والتراث</title>
    <!-- استيراد خط عربي فاخر -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --burgundy: #4a151b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 16px;
        }

        header h1 {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: var(--gold-light);
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--gold);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* نافذة النجاح ورقم الطلب */
        #successCard {
            display: none;
            text-align: center;
            background: #111;
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        #successCard h2 {
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .order-number-box {
            background: var(--burgundy);
            color: var(--gold-light);
            font-size: 2.2rem;
            font-weight: 900;
            padding: 12px;
            border-radius: 8px;
            letter-spacing: 3px;
            margin: 15px 0;
            border: 1px dashed var(--gold);
        }

        #successCard p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>

    <!-- ربط فايربيس (Firebase SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForEzwaStoreApp99",
            authDomain: "ezwa-store.firebaseapp.com",
            projectId: "ezwa-store",
            storageBucket: "ezwa-store.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جعل دالة الطلب متاحة عالمياً في الصفحة
        window.submitOrder = async function() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري إرسال الطلب...";

            // 1. توليد رقم طلب تسلسلي فريد
            const orderNumber = 'EZ-' + Math.floor(1000 + Math.random() * 9000);

            const selectedProduct = document.getElementById('productSelect').value;
            const selectedSize = document.getElementById('sizeSelect').value;
            const selectedTable = document.getElementById('tableSelect').value;
            const selectedPayment = document.getElementById('paymentSelect').value;

            const orderData = {
                orderId: orderNumber,
                product: selectedProduct,
                size: selectedSize,
                table: selectedTable,
                paymentMethod: selectedPayment,
                createdAt: new Date().toISOString()
            };

            try {
                // حفظ الطلب في قاعدة البيانات السحابية
                await addDoc(collection(db, "orders"), orderData);

                // إخفاء نموذج الطلب وإظهار كارت النجاح ورقم الطلب
                document.getElementById('orderForm').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
                document.getElementById('orderNumberDisplay').innerText = orderNumber;

            } catch (e) {
                console.error("خطأ في إرسال الطلب: ", e);
                alert("حدث خطأ بسيط، يرجى المحاولة مرة أخرى.");
                btn.disabled = false;
                btn.innerText = "تأكيد وإرسال الطلب";
            }
        };
    </script>
</head>
<body>

    <header>
        <h1>عِزوة | EZWA</h1>
        <p>تجربة التراث والأزياء الفاخرة - مقهى قصر المصمك</p>
    </header>

    <div class="container">
        <!-- نموذج الطلب -->
        <div id="orderForm">
            <div class="form-group">
                <label for="productSelect">اختر القطعة:</label>
                <select id="productSelect">
                    <option value="تيشيرت عِزوة - قصر المصمك (بورغندي)">تيشيرت قصر المصمك (بورغندي مع تطريز السدو)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sizeSelect">اختر المقاس:</label>
                <select id="sizeSelect">
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L" selected>Large (L)</option>
                    <option value="XL">X-Large (XL)</option>
                    <option value="XXL">XX-Large (XXL)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tableSelect">رقم الطاولة:</label>
                <select id="tableSelect">
                    <option value="الطاولة #01">الطاولة #01</option>
                    <option value="الطاولة #02">الطاولة #02</option>
                    <option value="الطاولة #03">الطاولة #03</option>
                    <option value="الطاولة #04" selected>الطاولة #04</option>
                    <option value="الطاولة #05">الطاولة #05</option>
                    <option value="جلسة التراث الخارجية">جلسة التراث الخارجية</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentSelect">طريقة الدفع:</label>
                <select id="paymentSelect">
                    <option value="بطاقة مدى / ابل باي">بطاقة مدى / Apple Pay</option>
                    <option value="الدفع النقدي عند الكاونتر">الدفع النقدي عند الكاونتر</option>
                </select>
            </div>

            <button id="submitBtn" class="btn-submit" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
        </div>

        <!-- رسالة النجاح ورقم الطلب للعميل -->
        <div id="successCard">
            <h2>تم إرسال طلبك بنجاح! ☕✨</h2>
            <p>أبرز هذا الرقم للباريستا عند الكاونتر لاستلام طلبك فوراً:</p>
            <div class="order-number-box" id="orderNumberDisplay">EZ-0000</div>
            <p style="margin-top: 15px; color: var(--gold-light);">شكراً لاختيارك عِزوة. نتشرف بخدمتك!</p>
        </div>
    </div>

</body>
</html>
